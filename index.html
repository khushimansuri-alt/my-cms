<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog</title><link rel="stylesheet" href="/theme.css"></head>
<body><div class="wrap"><h1>Blog</h1><div id="l">Loading...</div></div>
<script>
fetch('/posts/index.json').then(function(r){return r.json()}).then(function(l){
  var b=document.getElementById('l');b.textContent='';
  l=l.filter(function(p){return !p.draft});
  if(!l.length)b.textContent='No posts yet.';
  l.forEach(function(p){
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<h2><a></a></h2><small></small><p></p>';
    var a=d.querySelector('a');a.href='/posts/'+p.slug+'/';a.textContent=p.title;
    d.querySelector('small').textContent=p.date;
    d.querySelector('p').textContent=p.excerpt||'';
    b.appendChild(d);
  });
}).catch(function(){document.getElementById('l').textContent='No posts yet.'});
</script></body></html>
